# Bundle entry is inert by default; users enable it after configuring AGY.
# Install this package into a DSH profile with:
# npx @deepseek-ai/dsh plugin --profile web add dsh-agy-provider@0.4.0
- insert:
    - id: dsh-agy-provider
      name: dsh-agy-provider
      config:
        enabled: false
        provider: agy
        model: gemini-3.1-pro-high
        toolPolicy: reject
        agent: deepseek-proxy
        sessionMode: full
