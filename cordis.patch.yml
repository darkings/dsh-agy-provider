# Bundle entry is enabled by default when installed through dsh plugin add.
# Install this package into a DSH profile with:
# npx @deepseek-ai/dsh plugin --profile web add dsh-agy-provider@0.7.0
- insert:
    - id: dsh-agy-provider
      name: dsh-agy-provider
      config:
        enabled: true
        provider: agy
        model: gemini-3.1-pro-high
        toolPolicy: dsh-owned
        agent: deepseek-proxy
        sessionMode: full
        imageInput: off
